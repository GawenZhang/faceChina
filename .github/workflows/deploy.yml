name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-www
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to 110.40.173.15
    runs-on: ubuntu-latest
    steps:
      - name: Publish site
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 110.40.173.15
          username: ubuntu
          port: 22
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          script: |
            cd "$HOME/faceChina"
            git remote set-url origin git@github.com:GawenZhang/faceChina.git
            git fetch origin main
            git checkout -f main
            git reset --hard origin/main
            tar -czf /tmp/o2magic-site.tar.gz index.html favicon.png favicon.svg robots.txt sitemap.xml llms.txt css js img about app articles products privacy terms downloads
            sudo /usr/local/bin/deploy-o2magic
