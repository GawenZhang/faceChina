name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-www
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to 110.40.173.15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pack site
        env:
          GEO_SITE_ORIGIN: ${{ vars.GEO_SITE_ORIGIN }}
        run: |
          node scripts/build-geo.mjs
          tar -czf site.tar.gz index.html favicon.png favicon.svg robots.txt sitemap.xml llms.txt css js img/logo.png img/products about app articles en products privacy terms downloads/O2Magic.apk
          ls -lh site.tar.gz

      - name: Upload site archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 110.40.173.15
          username: ubuntu
          port: 22
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 10m
          source: site.tar.gz
          target: /tmp/o2magic-upload
          overwrite: true

      - name: Publish site
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 110.40.173.15
          username: ubuntu
          port: 22
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            sudo /usr/local/bin/deploy-o2magic /tmp/o2magic-upload/site.tar.gz
